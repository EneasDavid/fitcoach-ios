# Regression suite. Every job is a test the project already has, run on every pull request and every push to main, and nightly on main
# (a dependency or an OS image can break things without a commit). Nothing here needs a secret.
#
# Runner images: the app uses iOS 26 APIs, so the macOS jobs need an Xcode 26+ image (`macos-26`); `scripts/ci/select_xcode.sh` picks the newest
# Xcode installed. If your account has no such image yet, change `runs-on` for the jobs marked [macOS].
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      run-ui:
        description: 'Run the (slow) app + UI regression job: "true" or "false" (a string on purpose: an absent boolean input reads as false in expressions)'
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci-scripts:
    name: CI checkers (workflow hardening + MASVS rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: pip install pyyaml==6.0.2
      - name: The checkers catch what they should (tests of the tests)
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  functions:
    name: Cloud Functions (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: firebase/package-lock.json }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - run: npm test
        working-directory: firebase

  packages:
    name: "[macOS] Package tests + 70 % coverage gate"
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: scripts/ci/select_xcode.sh
      - name: Domain, SyncKit, SecurityKit, DataKit and PresentationKit with coverage (fails below COVERAGE_MIN, default 70)
        run: scripts/coverage.sh

  app:
    name: "[macOS] App tests + UI regression (iPhone simulator)"
    runs-on: macos-26
    needs: packages
    if: ${{ inputs.run-ui != 'false' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: scripts/ci/select_xcode.sh
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test (the UI suite is iPhone-only by design)
        run: |
          UDID="$(scripts/ci/pick_iphone.sh)"
          echo "Simulator: $UDID"
          mkdir -p build
          # A UI test that fails is re-run up to twice: typing into a masked field on a loaded CI simulator can still lose a keystroke.
          # A test that needs the retry is listed as such in the result bundle, so it stays visible. Real failures fail all three times.
          xcodebuild test \
            -project FitCoach.xcodeproj -scheme FitCoach \
            -destination "id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath build/FitCoach.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xcresult
          path: build/FitCoach.xcresult
          retention-days: 14
