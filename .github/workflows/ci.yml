# Regression suite. Every job is a test the project already has, run on every pull request and every push to main, and nightly on main
# (a dependency or an OS image can break things without a commit). Nothing here needs a secret.
#
# Runner images: the app uses iOS 26 APIs, so the macOS jobs need an Xcode 26+ image (`macos-26`); `scripts/ci/select_xcode.sh` picks the newest
# Xcode installed. If your account has no such image yet, change `runs-on` for the jobs marked [macOS].
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci-scripts:
    name: CI checkers (workflow hardening + MASVS rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: pip install pyyaml==6.0.2
      - name: The checkers catch what they should (tests of the tests)
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  functions:
    name: Cloud Functions (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: firebase/package-lock.json }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - run: npm test
        working-directory: firebase

  packages:
    name: "[macOS] Package tests + 70 % coverage gate"
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: scripts/ci/select_xcode.sh
      - name: Domain, SyncKit, SecurityKit, DataKit and PresentationKit with coverage (fails below COVERAGE_MIN, default 70)
        run: scripts/coverage.sh

  app:
    name: "[macOS] App tests + UI regression (iPhone simulator)"
    runs-on: macos-26
    needs: packages
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: scripts/ci/select_xcode.sh
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test (the UI suite is iPhone-only by design)
        run: |
          UDID="$(scripts/ci/pick_iphone.sh)"
          echo "Simulator: $UDID"
          mkdir -p build
          xcodebuild test \
            -project FitCoach.xcodeproj -scheme FitCoach \
            -destination "id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath build/FitCoach.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: xcresult
          path: build/FitCoach.xcresult
          retention-days: 14
